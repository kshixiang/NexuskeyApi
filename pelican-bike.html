<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑行</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: #193e3a;
      background: #f8f4e7;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 56px);
    }

    main { width: min(100%, 1120px); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: clamp(16px, 2.4vw, 28px);
    }

    h1 {
      display: flex;
      align-items: center;
      gap: clamp(10px, 1.5vw, 18px);
      margin: 0;
      font-size: clamp(25px, 4.3vw, 48px);
      letter-spacing: .08em;
      line-height: 1.2;
    }

    h1 svg { width: clamp(30px, 4.6vw, 52px); flex: none; }

    button {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 15px;
      border: 1px solid #527068;
      border-radius: 999px;
      color: inherit;
      background: #fffaf0;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
    }

    button:hover { background: #e9eee0; }
    button:focus-visible { outline: 3px solid #b64b2b; outline-offset: 4px; }
    button svg { width: 16px; height: 16px; }

    .scene {
      display: block;
      width: 100%;
      aspect-ratio: 1120 / 640;
      overflow: hidden;
      border: 1px solid #acaa90;
      border-radius: clamp(16px, 2.5vw, 30px);
      box-shadow: 0 18px 44px #463b201c, 0 2px 4px #463b2019;
      background: #f5dfae;
    }

    @media (max-width: 640px) {
      .scene { aspect-ratio: 1 / 1; }
    }
  </style>
</head>
<body>

  <script>
    const svgPart = (id) => document.getElementById(id);
    const rider = svgPart('rider');
    const scarf = svgPart('scarf-tail');
    const eye = svgPart('eye');
    const wheels = [svgPart('rear-wheel'), svgPart('front-wheel')];
    const crank = svgPart('crank');
    const nearLeg = [svgPart('near-leg-outline'), svgPart('near-leg')];
    const farLeg = [svgPart('far-leg')];
    const nearFoot = svgPart('near-foot');
    const farFoot = svgPart('far-foot');
    const road = svgPart('road');
    const roadMarks = svgPart('road-marks');
    const ripples = svgPart('ripples');
    const nearCloud = svgPart('cloud-near');
    const farCloud = svgPart('cloud-far');
    const playback = svgPart('playback');
    const playbackIcon = svgPart('playback-icon');
    const playbackLabel = svgPart('playback-label');
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    const fullTurn = 2 * Math.PI;
    const crankX = 239;
    const crankY = 383;
    const crankRadius = 24;
    const wheelRadius = 87;
    const roadSpeed = 350;
    let playing = false;
    let frameId = 0;
    let previousTime = null;
    let elapsed = 0;

    function drawLeg(hipX, hipY, angle, leg, foot) {
      const pedalX = crankX + crankRadius * Math.cos(angle);
      const pedalY = crankY + crankRadius * Math.sin(angle);
      const ankleY = pedalY - 5;
      const dx = pedalX - hipX;
      const dy = ankleY - hipY;
      const distance = Math.hypot(dx, dy);
      const thigh = 83;
      const shin = 77;
      const kneeAlong = (thigh ** 2 - shin ** 2 + distance ** 2) / (2 * distance);
      const kneeOffset = Math.sqrt(Math.max(0, thigh ** 2 - kneeAlong ** 2));
      const kneeX = hipX + (dx * kneeAlong + dy * kneeOffset) / distance;
      const kneeY = hipY + (dy * kneeAlong - dx * kneeOffset) / distance;
      const path = `M${hipX} ${hipY}L${kneeX} ${kneeY}L${pedalX} ${ankleY}`;

      for (const stroke of leg) {
        stroke.setAttribute('d', path);
      }
      foot.setAttribute('transform', `translate(${pedalX} ${ankleY})`);
    }

    function draw(time) {
      const angle = fullTurn * (time / 2.15) + 0.45;
      const degrees = angle * 180 / Math.PI;
      const distance = time * roadSpeed;
      const wheelDegrees = (distance / wheelRadius) * 180 / Math.PI;
      const bob = Math.sin(angle * 2) * 2.1;
      const blink = Math.max(0, 1 - Math.abs(time % 5.2 - 3.8) / 0.11);

      for (const wheel of wheels) {
        wheel.setAttribute('transform', `rotate(${wheelDegrees % 360})`);
      }
      crank.setAttribute('transform', `translate(${crankX} ${crankY}) rotate(${degrees % 360})`);
      drawLeg(205, 260 + bob, angle, nearLeg, nearFoot);
      drawLeg(218, 254 + bob, angle + Math.PI, farLeg, farFoot);
      rider.setAttribute('transform', `translate(0 ${bob})`);
      scarf.setAttribute('transform', `rotate(${Math.sin(time * 9) * 4 + Math.sin(time * 5) * 3} 263 172)`);
      eye.setAttribute('transform', `translate(0 115) scale(1 ${1 - blink * 0.88}) translate(0 -115)`);

      road.setAttribute('transform', `translate(${-distance % 180} 0)`);
      roadMarks.setAttribute('stroke-dashoffset', distance % 90);
      ripples.setAttribute('transform', `translate(${-time * 23 % 224} 0)`);
      nearCloud.setAttribute('transform', `translate(${1160 - (1037 + time * 12) % 1360} 105)`);
      farCloud.setAttribute('transform', `translate(${1160 - (200 + time * 7) % 1360} 213) scale(.73)`);
    }

    function advance(timestamp) {
      if (previousTime !== null) {
        elapsed += Math.min(timestamp - previousTime, 40) / 1000;
      }
      previousTime = timestamp;
      draw(elapsed);
      frameId = requestAnimationFrame(advance);
    }

    function setPlaying(next) {
      cancelAnimationFrame(frameId);
      previousTime = null;
      playing = next;
      playbackLabel.textContent = playing ? '暂停' : '播放';
      playbackIcon.setAttribute('d', playing ? 'M4 3v10M12 3v10' : 'm5 3 7 5-7 5Z');

      if (playing) {
        frameId = requestAnimationFrame(advance);
      }
    }

    playback.addEventListener('click', () => setPlaying(!playing));
    reducedMotion.addEventListener('change', (event) => setPlaying(!event.matches));
    draw(0);
    setPlaying(!reducedMotion.matches);
  </script>
