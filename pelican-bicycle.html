<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#d9eee9">
  <title>顺风骑行 · 鹈鹕的海边日常</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #213f3b; background: #d9eee9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .app { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; position: relative; }
    header { padding: 30px 5vw 0; display: flex; justify-content: space-between; align-items: center; gap: 16px; z-index: 1; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { width: 35px; height: 35px; }
    .brand-name { font-size: 12px; font-weight: 750; letter-spacing: 0; }
    .edition { font-size: 11px; font-family: ui-monospace, monospace; opacity: .65; }
    main { position: relative; min-height: 0; display: grid; align-items: center; }
    .heading { position: absolute; top: 35px; left: 7.5%; z-index: 1; pointer-events: none; }
    h1 { font-size: 42px; font-weight: 800; letter-spacing: 0; margin: 0 0 10px; line-height: 1.2; }
    .heading p { margin: 0; font-size: 13px; color: #52756c; }
    .scene { display: block; width: 100%; height: min(74svh, 840px); min-height: 430px; }
    footer { display: flex; align-items: center; justify-content: space-between; padding: 20px 5vw 28px; gap: 24px; z-index: 1; }
    .caption { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #52756c; }
    .caption-line { width: 32px; height: 1px; background: #7b9a8d; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .icon-button { border: 1px solid #93b6a8; border-radius: 50%; background: transparent; color: #213f3b; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; position: relative; }
    .icon-button.primary { background: #234c40; border-color: #234c40; color: #fffef4; }
    .icon-button:hover { background: #c7dfd3; }
    .icon-button.primary:hover { background: #346654; }
    .icon-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon-button:focus-visible, input:focus-visible { outline: 3px solid #dc7159; outline-offset: 4px; }
    .tooltip { position: absolute; bottom: 52px; white-space: nowrap; background: #234c40; color: white; font-size: 11px; padding: 6px 8px; border-radius: 4px; opacity: 0; pointer-events: none; transition: opacity .15s; }
    .icon-button:hover .tooltip, .icon-button:focus-visible .tooltip { opacity: 1; }
    .speed { display: flex; align-items: center; gap: 10px; padding-left: 8px; }
    .speed svg { width: 18px; height: 18px; stroke: #52756c; fill: none; stroke-width: 1.5; stroke-linecap: round; }
    input[type="range"] { accent-color: #315f4b; width: 90px; height: 20px; cursor: pointer; }
    output { min-width: 36px; font: 12px ui-monospace, monospace; }
    [hidden] { display: none !important; }
    @media (min-width: 1600px) { .app { max-width: 1800px; margin-inline: auto; } }
    @media (max-width: 600px) {
      header { padding: 22px 6vw 0; }
      .brand-name { font-size: 10px; }
      .edition { font-size: 10px; }
      .heading { top: 40px; left: 8%; }
      h1 { font-size: 32px; }
      .heading p { font-size: 12px; }
      .scene { height: 68svh; min-height: 450px; }
      footer { padding: 12px 6vw 24px; flex-wrap: wrap; justify-content: center; gap: 17px; }
      .caption { width: 100%; justify-content: center; font-size: 11px; }
    }
  </style>
</head>
<body>

    <main>

          <path d="M455 318c8-28 47-42 88-38 36 3 57 17 72 17 14-1 18-21 11-40-6-17-14-29-10-44 4-19 26-27 42-18 14 7 18 26 12 41-6 16-3 31 5 53 13 34 5 62-20 76-20 13-38 12-54 20-27 16-39 23-79 15-43-9-79-39-67-82Z" fill="#fffdf0" stroke="#3e5c4e" stroke-width="3.5" stroke-linejoin="round"/>

            <path d="M635 147q-6-13-1-18m8 16q0-14 7-20m1 19q5-10 13-11" fill="none" stroke="#3e5c4e" stroke-width="3" stroke-linecap="round"/>
            <path d="M676 188q14 60 58 62 29 0 64-52Z" fill="#eab16f" stroke="#895b3d" stroke-width="3" stroke-linejoin="round"/>
            <path d="M689 201q18 42 42 41 20-1 39-21-39 10-81-20Z" fill="#e79b67"/>

            <path d="m694 182 96 15" fill="none" stroke="#ffe092" stroke-width="3" stroke-linecap="round"/>

            <ellipse cx="665" cy="170" rx="10" ry="11" fill="#e9d985"/>

            <path d="M634 185q6 6 13 3" fill="none" stroke="#e9ae86" stroke-width="4" stroke-linecap="round"/>
          </g>

        <g id="flowers"><g id="flower-a" transform="translate(145 699)"><use href="#flower"/></g><g id="flower-b" transform="translate(1028 716) scale(1.15)"><use href="#flower"/></g><g id="flower-c" transform="translate(1090 700) scale(.75)"><use href="#flower"/></g></g>

    <footer>
      <div class="caption"><span class="caption-line"></span><span>沿海公路 · 天气晴 · 心情轻盈</span></div>
      <div class="controls" role="group" aria-label="动画控制">
        <button id="play" class="icon-button primary" type="button" aria-label="暂停动画" aria-pressed="false">
          <svg id="pause-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
          <svg id="play-icon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="m8 5 11 7-11 7Z"/></svg>
          <span id="play-tooltip" class="tooltip">暂停</span>
        </button>
        <button id="restart" class="icon-button" type="button" aria-label="重新播放"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg><span class="tooltip">重新播放</span></button>
        <label class="speed" title="骑行速度">

          <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="骑行速度">

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const parts = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'crank', 'far-shin', 'far-foot',
        'near-shin', 'near-foot', 'far-pedal', 'near-pedal', 'pelican',
        'head', 'scarf', 'shadow', 'clouds', 'coast-scroll', 'sea',
        'road-lines', 'ground-details', 'breeze', 'flower-a', 'flower-b', 'flower-c'
      ].map((id) => [id, byId(id)]));
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const mobileViewport = window.matchMedia('(max-width: 600px)');
      function frameScene() {
        byId('scene').setAttribute('viewBox', mobileViewport.matches ? '280 -120 660 940' : '0 0 1200 760');
      }
      mobileViewport.addEventListener('change', frameScene);
      frameScene();
      let playing = !motionPreference.matches;
      let speed = 1;
      let elapsed = 0;
      let previousTime = null;
      let frameId = null;
      const setTransform = (id, value) => parts[id].setAttribute('transform', value);

      // Solve each knee from two fixed-length segments and the moving pedal.
      function drawLeg(side, angle, bob) {
        const hip = { x: side === 'near' ? 547 : 529, y: 383 + bob };
        const foot = { x: 555 + Math.cos(angle) * 31, y: 541 + Math.sin(angle) * 31 };
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 102;
        const lower = 102;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {
          x: hip.x + dx / distance * along + dy / distance * bend,
          y: hip.y + dy / distance * along - dx / distance * bend
        };
        parts[side + '-shin'].setAttribute('d', `M${hip.x} ${hip.y} L${knee.x} ${knee.y} L${foot.x - 6} ${foot.y - 9}`);
        parts[side + '-foot'].setAttribute('d', `M${foot.x - 6} ${foot.y - 9} Q${foot.x + 3} ${foot.y - 3} ${foot.x + 15} ${foot.y - 3}`);
        setTransform(side + '-pedal', `translate(${foot.x} ${foot.y})`);
      }

      function render(time) {
        const angle = time * Math.PI * 1.12;
        const degrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle * 2) * 2.2;
        setTransform('rear-wheel', `rotate(${degrees * 1.32})`);
        setTransform('front-wheel', `rotate(${degrees * 1.32})`);
        setTransform('crank', `translate(555 541) rotate(${degrees})`);
        drawLeg('far', angle + Math.PI, bob);
        drawLeg('near', angle, bob);
        setTransform('pelican', `translate(0 ${bob})`);
        setTransform('head', `rotate(${Math.sin(angle) * .7} 644 213)`);
        setTransform('scarf', `rotate(${Math.sin(time * 7) * 3} 611 300)`);
        setTransform('clouds', `translate(${-time * 2 % 1300} 0)`);
        setTransform('coast-scroll', `translate(${-time * 13 % 1200} 0)`);
        parts.sea.setAttribute('x', 0);
        byId('sea-lines').setAttribute('patternTransform', `translate(${-time * 8 % 170} 0)`);
        parts['road-lines'].setAttribute('patternTransform', `translate(${-time * 155 % 135} 0)`);
        setTransform('ground-details', `translate(${-time * 39 % 150} 0)`);
        parts.shadow.setAttribute('rx', 229 + Math.sin(angle * 2) * 2);
        parts.breeze.setAttribute('opacity', .4 + (Math.sin(time * 3) + 1) * .25);
        setTransform('flower-a', `translate(145 699) rotate(${Math.sin(time * 2.6) * 5})`);
        setTransform('flower-b', `translate(1028 716) scale(1.15) rotate(${Math.sin(time * 2.6 + 1) * 6})`);
        setTransform('flower-c', `translate(1090 700) scale(.75) rotate(${Math.sin(time * 2.6 + 2) * 6})`);
      }

      function tick(timestamp) {
        frameId = null;
        if (!playing || document.hidden) return;
        if (previousTime !== null) elapsed += Math.min((timestamp - previousTime) / 1000, .05) * speed;
        previousTime = timestamp;
        render(elapsed);
        frameId = requestAnimationFrame(tick);
      }

      function schedule() {
        previousTime = null;
        if (playing && !document.hidden && frameId === null) frameId = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        byId('pause-icon').toggleAttribute('hidden', !playing);
        byId('play-icon').toggleAttribute('hidden', playing);
        byId('play').setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        byId('play').setAttribute('aria-pressed', String(!playing));
        byId('play-tooltip').textContent = playing ? '暂停' : '播放';
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        schedule();
      }

      byId('play').addEventListener('click', () => { playing = !playing; syncPlayback(); });
      byId('restart').addEventListener('click', () => {
        elapsed = 0;
        render(elapsed);
        playing = true;
        syncPlayback();
      });
      byId('speed').addEventListener('input', (event) => {
        speed = Number(event.target.value);
        byId('speed-value').value = speed.toFixed(2) + '×';
      });
      document.addEventListener('visibilitychange', () => {
        if (frameId !== null) cancelAnimationFrame(frameId);
        frameId = null;
        schedule();
      });
      motionPreference.addEventListener('change', (event) => {
        if (event.matches) { playing = false; syncPlayback(); }
      });
      render(0);
      syncPlayback();
    })();
  </script>
</body>
</html>
